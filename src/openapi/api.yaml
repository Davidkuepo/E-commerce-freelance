  /panier/create:
    post:
      tags:
        - Panier
      summary: Method that create a cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PanierCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponsePanier'

  /panier/add-product:
    post:
      tags:
        - Panier
      summary: Method that add product to cart
      parameters:
        - in: query
          name: panierCode
          required: true
          schema:
            type: string
        - in: query
          name: produitCode
          required: true
          schema:
            type: string
        - in: query
          name: quantite
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponsePanier'

  /panier/by-client:
    get:
      tags:
        - Panier
      summary: Method that get cart by client code
      parameters:
        - in: query
          name: clientCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponsePanier'

  /panier/remove-product:
    delete:
      tags:
        - Panier
      summary: Method that remove product from cart
      parameters:
        - in: query
          name: panierCode
          required: true
          schema:
            type: string
        - in: query
          name: produitCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponsePanier'

  /panier/clear:
    delete:
      tags:
        - Panier
      summary: Method that clear cart
      parameters:
        - in: query
          name: panierCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponsePanier'

  /produit/update:
    put:
      tags:
        - Produit
      summary: Method that update a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduitRequest'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduit'

  /produit/create:
    post:
      tags:
        - Produit
      summary: Method that create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProduitRequest'
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduit'

  /produit/get:
    get:
      tags:
        - Produit
      summary: Method that get a product by code
      parameters:
        - in: query
          name: produitCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduit'

  /produit/by-category:
    get:
      tags:
        - Produit
      summary: Method that get products by category
      parameters:
        - in: query
          name: categorie
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduitList'

  /produit/all:
    get:
      tags:
        - Produit
      summary: Method that get all products
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduitList'

  /produit/delete:
    delete:
      tags:
        - Produit
      summary: Method that delete a product
      parameters:
        - in: query
          name: produitCode
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ApiResponseProduit'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
        - id
        - email
        - name
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required:
        - email
        - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds until expiration
        user:
          $ref: '#/components/schemas/User'
      required:
        - accessToken
        - user
    RegisterRequest:
      type: object
      properties:
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
          format: email
        telephone:
          type: string
        adresse:
          type: string
        password:
          type: string
          format: password
      required:
        - nom
        - prenom
        - email
        - telephone
        - adresse
        - password
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - message
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        currency:
          type: string
          example: USD
        images:
          type: array
          items:
            type: string
            format: uri
        category:
          type: string
        stock:
          type: integer
        rating:
          type: number
          format: float
      required:
        - id
        - name
        - price
        - currency
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - items
        - total
        - page
        - pageSize
    CartItem:
      type: object
      properties:
        itemId:
          type: string
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          minimum: 1
        subtotal:
          type: number
          format: float
      required:
        - itemId
        - product
        - quantity
    Cart:
      type: object
      properties:
        id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        total:
          type: number
          format: float
        currency:
          type: string
      required:
        - id
        - items
        - total
    AddToCartRequest:
      type: object
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
      required:
        - productId
        - quantity
    UpdateCartItemRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
      required:
        - quantity
    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: string
        total:
          type: number
          format: float
        currency:
          type: string
        status:
          type: string
          example: paid
      required:
        - orderId
        - total
        - currency
        - status
    PanierProduct:
      type: object
      properties:
        produitCode:
          type: string
        nom:
          type: string
        description:
          type: string
        prix:
          type: number
          format: float
        stock:
          type: integer
          format: int32
        categorie:
          type: string
        state:
          type: string
      required:
        - produitCode
        - nom
        - prix
    Panier:
      type: object
      properties:
        panierCode:
          type: string
        dateCreation:
          type: string
          format: date-time
        clientCode:
          type: string
        produits:
          type: array
          items:
            $ref: '#/components/schemas/PanierProduct'
        state:
          type: string
      required:
        - panierCode
        - clientCode
        - produits
        - state
    ApiResponsePanier:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/Panier'
        code:
          type: integer
          format: int32
        status:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - timestamp
        - data
        - code
        - status
    PanierCreateRequest:
      type: object
      properties:
        # panierCode:
        #   type: string
        clientCode:
          type: string
        state:
          type: string
      required:
        - panierCode
        - clientCode
        - state

    Produit:
      type: object
      properties:
        produitCode:
          type: string
        nom:
          type: string
        description:
          type: string
        prix:
          type: number
          format: float
        stock:
          type: integer
          format: int32
        categorie:
          type: string
        state:
          type: string
        image:
          type: string
          format: uri
      required:
        - produitCode
        - nom
        - prix

    ProduitRequest:
      type: object
      properties:
        produitCode:
          type: string
        nom:
          type: string
        description:
          type: string
        prix:
          type: number
          format: float
        stock:
          type: integer
          format: int32
        categorie:
          type: string
        state:
          type: string
        image:
          type: string
          format: uri
      required:
        - produitCode
        - nom
        - prix

    ApiResponseProduit:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/Produit'
        code:
          type: integer
          format: int32
        status:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - timestamp
        - data
        - code
        - status

    ApiResponseProduitList:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        data:
          type: array
          items:
            $ref: '#/components/schemas/Produit'
        code:
          type: integer
          format: int32
        status:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - timestamp
        - data
        - code
        - status

    ApiResponseBoolean:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        data:
          type: boolean
        code:
          type: integer
          format: int32
        status:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - timestamp
        - data
        - code
        - status

    ApiResponseString:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        data:
          type: string
        code:
          type: integer
          format: int32
        status:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - timestamp
        - data
        - code
        - status

    VerifyOtpRequest:
      type: object
      properties:
        otpCode:
          type: string
      required:
        - otpCode

    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token

    SendTokenVerifyEmailRequest:
      type: object
      properties:
        userEmail:
          type: string
      required:
        - userEmail

    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
        password:
          type: string
          format: password
      required:
        - token
        - password

    CreateSuperAdminRequest:
      type: object
      properties:
        userCode:
          type: string
        userNames:
          type: string
        userPhoneNumber:
          type: string
        userPassword:
          type: string
          format: password
        userState:
          type: string
        roles:
          type: array
          items:
            type: object
            additionalProperties: true
        token:
          type: string
        userEmail:
          type: string
          format: email
        preferredCurrency:
          type: string
        addresses:
          type: array
          items:
            type: object
            additionalProperties: true
        image:
          type: string
          format: uri
        theme:
          type: string